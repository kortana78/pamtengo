services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamtengo
      POSTGRES_PASSWORD: pamtengo
      POSTGRES_DB: pamtengo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamtengo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://pamtengo:pamtengo@db:5432/pamtengo
      AI_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
